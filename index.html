<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget & Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SpendWise</h1>
            <p>Smart Personal Budgeting & Expense Tracker</p>
        </header>

        <main>
            <div class="card">
                <h2>Financial Summary</h2>
                <p>Check your browser console (F12 or Right Click > Inspect > Console) to see the interactive prompts and calculation logs!</p>
                <button onclick="runSpendWiseApp()">Start Budget Tracker</button>
            </div>
        </main>
    </div>

    <!-- Properly linked JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
